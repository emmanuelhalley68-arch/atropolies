<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101827">
  <title>Your account | ATROPOLIES</title>
  <link rel="stylesheet" href="assets/auth-base.css">
  <link rel="stylesheet" href="auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth-common.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header auth-header">
    <a class="brand" href="index.html"><span class="brand-mark">A</span><span>ATROPOLIES</span></a>
    <button class="button button-quiet" id="logoutButton" type="button">Sign out</button>
  </header>
  <main class="auth-main">
    <section class="auth-card dashboard-card" aria-labelledby="pageTitle">
      <p class="eyebrow">YOUR DIGITAL CITY</p>
      <h1 id="pageTitle">Your<br><span>dashboard.</span></h1>
      <p class="auth-intro" id="welcomeMessage">Checking your secure session…</p>
      <div class="account-panel">
        <p class="field-help">ACCOUNT EMAIL</p>
        <p id="accountEmail" class="account-value">Loading…</p>
        <p class="field-help">DISPLAY NAME</p>
        <p id="displayName" class="account-value">Loading…</p>
        <p class="field-help">ACCOUNT ROLE</p>
        <p id="accountRole" class="account-value">Checking permissions…</p>
      </div>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
      <a class="button button-primary auth-submit" href="security.html">Account security settings</a>
      <a class="auth-switch" href="index.html">Return to the city</a>
    </section>
  </main>
  <footer class="footer auth-footer"><p>One City, Every Dream.</p><span>Private account area</span></footer>
</body>
</html>
