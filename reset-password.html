<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Choose a new password | ATROPOLIES</title>
  <link rel="stylesheet" href="assets/auth-base.css">
  <link rel="stylesheet" href="auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/input-security.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth-common.js" defer></script>
  <script src="js/reset-password.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header auth-header"><a class="brand" href="index.html"><span class="brand-mark">A</span><span>ATROPOLIES</span></a></header>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="pageTitle">
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1 id="pageTitle">Choose a new<br><span>password.</span></h1>
      <form id="resetForm" class="auth-form">
        <label for="password">New password</label>
        <input id="password" type="password" minlength="12" autocomplete="new-password" required>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required>
        <button class="button button-primary auth-submit" type="submit">Update password</button>
      </form>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer class="footer auth-footer"><p>One City, Every Dream.</p><a href="index.html">Back to ATROPOLIES</a></footer>
</body>
</html>
